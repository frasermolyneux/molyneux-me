name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions: {}

jobs:
  dependabot-policy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    outputs:
      auto_merge_allowed: ${{ steps.evaluate.outputs.auto_merge_allowed }}
    steps:
      - name: Evaluate Dependabot policy
        id: evaluate
        uses: frasermolyneux/actions/dependabot-policy@dependabot-policy/v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  dependabot:
    needs:
      - dependabot-policy
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.dependabot-policy.outputs.auto_merge_allowed == 'true' }}
    steps:
      - name: Enable auto-merge for approved bot PRs
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for pull request merge
        shell: bash
        run: |
          for attempt in {1..60}; do
            state=$(gh pr view "$PR_URL" --json state --jq '.state')

            case "$state" in
              MERGED)
                exit 0
                ;;
              CLOSED)
                echo "::error::Pull request closed without merging"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for pull request merge"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Dispatch post-merge workflows
        run: |
          gh workflow run codequality.yml --ref main
          gh workflow run deploy-prd.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
